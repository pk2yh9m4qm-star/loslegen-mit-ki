<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Loslegen mit KI</title>
<style>
  :root { color-scheme: light dark; --grund: #F5F6F3; --tinte: #121614; --leise: #545C58; }
  @media (prefers-color-scheme: dark) { :root { --grund: #0C0E0D; --tinte: #F1F4F2; --leise: #A7B0AC; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--grund); color: var(--tinte);
         font: 400 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
  h1 { font-size: clamp(28px, 6vw, 44px); letter-spacing: -.02em; margin: 0 0 8px; }
  p { margin: 0; color: var(--leise); }
</style>
</head>
<body>
<main>
  <h1>Hier entsteht gerade etwas.</h1>
  <p>Bald mehr.</p>
</main>
</body>
</html>
